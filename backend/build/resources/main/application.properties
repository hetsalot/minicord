server.port=${SERVER_PORT:9001}

# Server identity
minicord.server.id=${SERVER_ID:1}
minicord.server.total-nodes=${TOTAL_NODES:3}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minicord}
spring.datasource.username=${DB_USER:minicord}
spring.datasource.password=${DB_PASSWORD:minicord123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# RMI
minicord.rmi.registry.host=${RMI_REGISTRY_HOST:localhost}
minicord.rmi.registry.port=${RMI_REGISTRY_PORT:1099}

# Peers (comma-separated host:port pairs for other servers)
minicord.peers=${PEERS:}

# JWT
minicord.jwt.secret=${JWT_SECRET:minicord-super-secret-key-for-jwt-tokens-2026}
minicord.jwt.expiration=86400000

# Heartbeat
minicord.heartbeat.interval-ms=3000
minicord.heartbeat.timeout-ms=9000

# Clock sync
minicord.clock.sync-interval-ms=30000

# Consistency (STRONG, EVENTUAL, QUORUM)
minicord.consistency.mode=${CONSISTENCY_MODE:EVENTUAL}
minicord.consistency.quorum-w=2
minicord.consistency.quorum-r=2

# Election algorithm (BULLY, RING)
minicord.election.algorithm=${ELECTION_ALGORITHM:BULLY}

# Load balancer
minicord.lb.algorithm=${LB_ALGORITHM:ROUND_ROBIN}

# Logging
logging.level.com.minicord=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
