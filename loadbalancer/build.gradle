plugins {
    id 'java'
    id 'application'
}

group = 'com.minicord.lb'
version = '1.0.0'
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.minicord.lb.LoadBalancerServer'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.minicord.lb.LoadBalancerServer'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = 'minicord-loadbalancer.jar'
}
